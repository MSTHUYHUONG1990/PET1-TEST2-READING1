<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PET Test 1 - Reading 1</title>

<style>
body{
    font-family: Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    margin:0;
}
.container{
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:12px;
}
h2{text-align:center;color:#333}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

button{
    padding:10px 15px;
    background:#6c5ce7;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
button:hover{background:#4834d4}

.hidden{display:none}

.question{
    margin-bottom:15px;
    border-bottom:1px solid #ddd;
    padding-bottom:8px;
}

.correct{color:green}
.wrong{color:red}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
th,td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}
</style>
</head>

<body>

<div class="container" id="start">
<h2>PET TEST 1 - READING 1</h2>
<input id="name" placeholder="Họ tên">
<input id="class" placeholder="Lớp">
<button onclick="startQuiz()">Bắt đầu</button>
</div>

<div class="container hidden" id="quizBox">
<h2>Làm bài</h2>
<div id="quiz"></div>
<button onclick="submitQuiz()">Nộp bài</button>
</div>

<div class="container hidden" id="resultBox">
<h2>Kết quả</h2>
<div id="result"></div>
<button onclick="location.reload()">Làm lại</button>
<button onclick="clearData()">Xóa bảng</button>

<h3>Bảng tổng hợp</h3>
<table>
<thead>
<tr>
<th>STT</th><th>Họ tên</th><th>Lớp</th><th>Đúng</th><th>Điểm</th><th>Thời gian</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<script>
const words = [
"lesson","beside","language laboratory","off sick","revise","test","workbook",
"available","application form","office","earliest","pick up","give in",
"holiday","windsurfing","barbecue","funfair","soon","reserved","attend",
"invited","borrow","lend","return","glad","laboratory","beside","sick",
"revise for","attend lesson","available from","bring","office","stopped for",
"sorry","borrow / lend","return it","available","forms"
];

const meanings = [
"bài học","bên cạnh","phòng lab ngôn ngữ","nghỉ ốm","ôn tập","bài kiểm tra",
"sách bài tập","có sẵn","đơn đăng ký","văn phòng","sớm nhất","đón","nộp",
"kỳ nghỉ","lướt ván","tiệc nướng","hội chợ","sớm","đã đặt trước","tham dự",
"được mời","mượn","cho mượn","trả lại","vui","phòng thí nghiệm","bên cạnh",
"ốm","ôn thi","tham gia buổi học","có từ","mang","văn phòng","dừng lại để",
"xin lỗi","mượn/cho mượn","trả nó","có sẵn","các mẫu đơn"
];

let html="";
words.forEach((w,i)=>{
    let correct=meanings[i];
    let options=[correct];

    while(options.length<4){
        let rand=meanings[Math.floor(Math.random()*meanings.length)];
        if(!options.includes(rand)) options.push(rand);
    }

    options.sort(()=>Math.random()-0.5);

    html+=`<div class="question">
    <b>${i+1}. ${w}</b><br>
    ${options.map(o=>`<label><input type="radio" name="q${i}" value="${o}"> ${o}</label><br>`).join("")}
    </div>`;
});

document.getElementById("quiz").innerHTML=html;

function startQuiz(){
    if(!name.value||!class.value){
        alert("Vui lòng nhập đầy đủ thông tin!");
        return;
    }
    start.classList.add("hidden");
    quizBox.classList.remove("hidden");
}

function submitQuiz(){
    let correct=0,output="";
    words.forEach((w,i)=>{
        let sel=document.querySelector(`input[name=q${i}]:checked`);
        let val=sel?sel.value:"";

        if(val===meanings[i]){
            correct++;
            output+=`<p class="correct">${i+1}. Đúng</p>`;
        }else{
            output+=`<p class="wrong">${i+1}. Sai (Đáp án: ${meanings[i]})</p>`;
        }
    });

    let score=(correct/words.length*10).toFixed(2);

    result.innerHTML=`
    <h3>Đúng: ${correct}/${words.length}</h3>
    <h3>Điểm: ${score}</h3>
    ${output}
    `;

    save(correct,score);

    quizBox.classList.add("hidden");
    resultBox.classList.remove("hidden");

    load();
}

function save(c,s){
    let data=JSON.parse(localStorage.getItem("petR1")||"[]");
    data.push({
        name:name.value,
        class:class.value,
        c,
        s,
        time:new Date().toLocaleString()
    });
    localStorage.setItem("petR1",JSON.stringify(data));
}

function load(){
    let data=JSON.parse(localStorage.getItem("petR1")||"[]");
    table.innerHTML=data.map((d,i)=>`
    <tr>
    <td>${i+1}</td>
    <td>${d.name}</td>
    <td>${d.class}</td>
    <td>${d.c}</td>
    <td>${d.s}</td>
    <td>${d.time}</td>
    </tr>
    `).join("");
}

function clearData(){
    localStorage.removeItem("petR1");
    load();
}
</script>

</body>
</html>
