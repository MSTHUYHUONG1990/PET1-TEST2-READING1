<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PET TEST</title>

<style>
body{font-family:Arial;margin:0;background:#6a85b6;}
.container{max-width:900px;margin:auto;background:#fff;padding:20px;margin-top:20px;border-radius:10px;}
input,button{padding:10px;margin:5px;border-radius:6px;border:1px solid #ccc;}
button{background:#4CAF50;color:white;cursor:pointer;}
.question{margin:10px 0;}
.correct{color:green;}
.wrong{color:red;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #ccc;padding:8px;text-align:center;}
</style>
</head>

<body>

<div class="container" id="start">
<h2>Nhập thông tin</h2>
<input id="nameInput" placeholder="Họ tên"><br>
<input id="classInput" placeholder="Lớp"><br>
<button onclick="start()">Bắt đầu</button>
</div>

<div class="container" id="quiz" style="display:none;">
<h2>Bài làm</h2>
<div id="questions"></div>
<button onclick="submit()">Nộp bài</button>
<div id="result"></div>
</div>

<div class="container">
<h3>Bảng kết quả</h3>
<table id="table"></table>
<button onclick="clearData()">Xóa bảng</button>
</div>

<script>
const data = [
["lesson","bài học"],["beside","bên cạnh"],
["language laboratory","phòng ngoại ngữ"],
["off sick","nghỉ ốm"],["revise","ôn tập"],
["test","bài kiểm tra"],["workbook","sách bài tập"],
["available","có sẵn"],["application form","đơn"],
["office","văn phòng"],["earliest","sớm nhất"],
["pick up","đón"],["give in","nộp"],
["holiday","kỳ nghỉ"],["windsurfing","lướt ván"],
["barbecue","tiệc nướng"],["funfair","hội chợ"],
["soon","sớm"],["reserved","đã đặt"],
["attend","tham gia"],["invited","được mời"],
["borrow","mượn"],["lend","cho mượn"],
["return","trả"],["glad","vui"],
["laboratory","phòng thí nghiệm"],["beside","bên cạnh"],
["sick","ốm"],["revise for","ôn thi"],
["attend lesson","đi học"],
["available from","có từ"],["bring","mang"],
["office","văn phòng"],["stopped for","dừng để"],
["sorry","xin lỗi"],["borrow / lend","mượn/cho mượn"],
["return it","trả nó"],["available","có sẵn"]
];

function start(){
let name=document.getElementById("nameInput").value;
let cls=document.getElementById("classInput").value;
if(!name||!cls){alert("Nhập đủ thông tin");return;}

document.getElementById("start").style.display="none";
document.getElementById("quiz").style.display="block";

let html="";
data.forEach((q,i)=>{
html+=`<div class="question">
<b>${i+1}. ${q[0]} nghĩa là?</b><br>
<label><input type="radio" name="q${i}" value="${q[1]}">${q[1]}</label><br>
<label><input type="radio" name="q${i}" value="sai1">sai</label><br>
<label><input type="radio" name="q${i}" value="sai2">không đúng</label><br>
<label><input type="radio" name="q${i}" value="sai3">không phải</label>
</div>`;
});
document.getElementById("questions").innerHTML=html;
}

function submit(){
let correct=0,html="";
data.forEach((q,i)=>{
let ans=document.querySelector(`input[name=q${i}]:checked`);
if(ans && ans.value===q[1]){
correct++; html+=`<div class="correct">Câu ${i+1} đúng</div>`;
}else{
html+=`<div class="wrong">Câu ${i+1} sai (${q[1]})</div>`;
}
});
let score=(correct/data.length*10).toFixed(2);

document.getElementById("result").innerHTML=
`Đúng ${correct}/${data.length} - Điểm ${score}`+html;

save(correct,score);
load();
}

function save(c,s){
let arr=JSON.parse(localStorage.getItem("kq")||"[]");
arr.push({
name:document.getElementById("nameInput").value,
class:document.getElementById("classInput").value,
c,s,time:new Date().toLocaleString()
});
localStorage.setItem("kq",JSON.stringify(arr));
}

function load(){
let arr=JSON.parse(localStorage.getItem("kq")||"[]");
let html="<tr><th>STT</th><th>Tên</th><th>Lớp</th><th>Đúng</th><th>Điểm</th><th>Thời gian</th></tr>";
arr.forEach((d,i)=>{
html+=`<tr>
<td>${i+1}</td><td>${d.name}</td><td>${d.class}</td>
<td>${d.c}</td><td>${d.s}</td><td>${d.time}</td>
</tr>`;
});
document.getElementById("table").innerHTML=html;
}

function clearData(){
localStorage.removeItem("kq"); load();
}

load();
</script>

</body>
</html>
